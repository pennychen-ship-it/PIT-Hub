<!doctype html>
<html lang="en" translate="no"><head><meta charset="utf-8"><meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Quest</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#2b2540;--mut:#6d6786;--card:rgba(255,255,255,.95);--ac:#2563eb;--ok:#1f9d63}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;min-height:100vh;background:#0b4a8f}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 90px;position:relative}
h1{font-size:22px;margin:4px 0 2px}.sub{opacity:.9;font-size:14px;margin-bottom:12px}
.card{background:var(--card);color:var(--ink);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 4px 14px rgba(0,0,0,.2);border-left:5px solid var(--ac)}
.bar{height:12px;background:#dbe5f7;border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#f59f00);transition:width .4s}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.t{font-weight:600}.m{font-size:13px;color:var(--mut)}
.tag{display:inline-block;background:#e3ecff;color:#1d4ed8;border-radius:20px;padding:2px 9px;font-size:12px;margin-right:6px}
button,.btn{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff;cursor:pointer;font-weight:600;display:inline-block}
button.g,.btn.g{background:#e3e9f5;color:var(--ink)}button.ok{background:var(--ok)}button.r{background:#e5484d}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid #c9d3e8;border-radius:10px;margin:4px 0 10px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto;margin:0}input[type=file]{display:none}
label{font-size:13px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.chip{background:#e3ecff;padding:6px 10px;border-radius:20px;display:flex;gap:5px;align-items:center;color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:6px;justify-content:center;z-index:5}
nav button{flex:1;max-width:150px;background:transparent;color:var(--mut)}nav button.on{background:#e3ecff;color:#1d4ed8}
.done{opacity:.75}.thumb{width:100%;max-height:240px;object-fit:cover;border-radius:10px;margin-top:8px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.sw span{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 1px #aaa}
.modal{position:fixed;inset:0;background:rgba(5,15,40,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;overflow:auto}
.modal .card{width:100%;max-width:420px}
.late{color:#c2410c}.pos{color:var(--ok);font-weight:700}
#gear{position:fixed;right:-30px;bottom:50px;width:200px;height:200px;opacity:.12;pointer-events:none}
</style></head><body>
<svg id="gear" viewBox="0 0 120 120" fill="none" stroke="currentColor"><circle cx="60" cy="60" r="44" stroke-width="14" stroke-dasharray="12 11.5"/><circle cx="60" cy="60" r="37" stroke-width="6"/><circle cx="60" cy="60" r="12" stroke-width="6"/></svg>
<div class="wrap" id="app"></div><nav id="nav"></nav><div id="modal"></div>
<script>
var KEY='dailyquest.v2',GOAL=100,DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function G(a,b,bg,s,t){return 'linear-gradient('+a+' 1px,transparent 1px) 0 0/'+s+'px '+s+'px,linear-gradient(90deg,'+a+' 1px,transparent 1px) 0 0/'+s+'px '+s+'px,linear-gradient('+b+' 1px,transparent 1px) 0 0/'+t+'px '+t+'px,linear-gradient(90deg,'+b+' 1px,transparent 1px) 0 0/'+t+'px '+t+'px,'+bg}
var TH={blueprint:['Blueprint',G('rgba(255,255,255,.10)','rgba(255,255,255,.24)','#0b4a8f',20,100),'#fff'],
circuit:['Circuit',G('rgba(80,255,150,.12)','rgba(80,255,150,.28)','#0d2b1d',30,120),'#fff'],
graph:['Graph paper',G('rgba(30,120,60,.18)','rgba(30,120,60,.4)','#f3f7ec',16,80),'#1a2b3c'],
steel:['Steel',G('rgba(255,255,255,.06)','rgba(255,255,255,.14)','#26303b',24,120),'#fff']};
var S={v:2,nick:'Friend',bg:'blueprint',bgImg:'',credits:0,tasks:[],done:{},journal:[]},col=null,mode='this device';
try{var raw=localStorage.getItem(KEY);if(raw)Object.assign(S,JSON.parse(raw));}catch(e){}
function lite(){var o={};for(var k in S)if(k!=='journal'&&k!=='bgImg')o[k]=S[k];return o}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){try{localStorage.setItem(KEY,JSON.stringify(lite()))}catch(e2){}}
 if(col)col.doc('state').set(lite()).catch(function(){})}
(async function(){try{
 if(!window.claude)return;
 var u=await claude.use('user'),d=await claude.use('db'),id=u&&await u.id();if(!d||!id)return;
 col=d.collection('data/users/'+id);
 var q=await col.get(),has=false,j=[];
 q.docs.forEach(function(x){var v=x.data()||{};
  if(x.id==='state'){has=true;Object.assign(S,v)}else if(x.id==='bg')S.bgImg=v.img||'';else if(x.id.charAt(0)==='j')j.push(v)});
 if(has)S.journal=j.sort(function(a,b){return a.id<b.id?1:-1});
 else{save();S.journal.forEach(function(e){col.doc(e.id).set(e).catch(function(){})});if(S.bgImg)col.doc('bg').set({img:S.bgImg}).catch(function(){})}
 mode='your account';render();
}catch(e){}})();
var tab='home',edit=null,fin=null,pic='',D=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function nowHM(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function fmt(v){var h=+v.slice(0,2);return (h%12||12)+':'+v.slice(3)+(h>=12?' PM':' AM')}
function isDone(id){return !!(S.done[today()]&&S.done[today()][id])}
function applies(t){return t.date?t.date===today():(!t.days||t.days.indexOf(new Date().getDay())>-1)}
function repTxt(t){return t.date?'Only '+(t.date===today()?'today':t.date):(!t.days?'Every day':t.days.map(function(i){return DN[i]}).join(' '))}
function applyBg(){var b=document.body,th=TH[S.bg];
 if(S.bgImg){b.style.background='url('+S.bgImg+') center/cover';b.style.color='#fff'}
 else if(th){b.style.background=th[1];b.style.color=th[2]}else{b.style.background=S.bg;b.style.color='#fff'}
 b.style.backgroundAttachment='fixed'}
function go(t){tab=t;render()}
function opts(a,s){return a.map(function(x){return '<option'+(String(x)===String(s)?' selected':'')+'>'+x+'</option>'}).join('')}
function rng(a,b){var r=[];for(var i=a;i<=b;i++)r.push(i);return r}
function newD(){return {s:'',t:'',due:'',c:10,rep:'daily',days:[1,2,3,4,5]}}
function grab(){if(!D||!document.getElementById('f_t'))return;D.s=f_s.value;D.t=f_t.value;D.c=f_c.value;D.due=getDue();D.rep=f_r.value;
 if(D.rep==='days')D.days=[].slice.call(document.querySelectorAll('.dchk:checked')).map(function(x){return +x.value})}
function getDue(){if(!f_h.value)return '';return pad(+f_h.value%12+(f_p.value==='PM'?12:0))+':'+f_m.value}
function startEdit(id){var t=S.tasks.filter(function(x){return x.id===id})[0];edit=id;
 D={s:t.subject,t:t.title,due:t.due||'',c:t.credit,rep:t.date?'once':(t.days?'days':'daily'),days:t.days||[1,2,3,4,5]};render();scrollTo(0,0)}
function render(){
 applyBg();if(!D)D=newD();
 var h='',tk=S.tasks.filter(applies),n=tk.filter(function(t){return isDone(t.id)}).length;
 if(tab==='home'){
  h+='<h1>Hi, '+esc(S.nick)+'!</h1><div class="sub">'+new Date().toDateString()+'</div><div id="clk" style="font-size:34px;font-weight:700;margin:-4px 0 8px"></div>';
  h+='<div class="card"><div class="row"><span class="t">⭐ '+S.credits+' / '+GOAL+' credits</span><span class="m">Gift from Mom 🎁</span></div><div class="bar"><i style="width:'+Math.min(100,S.credits/GOAL*100)+'%"></i></div>';
  h+=S.credits>=GOAL?'<button class="ok" onclick="claim()">Claim my gift from Mom!</button>':'<span class="m">'+(GOAL-S.credits)+' more credits to go</span>';
  h+='</div><div class="card"><span class="t">Today: '+n+' / '+tk.length+' done</span></div>';
  if(!tk.length)h+='<div class="card m">No tasks for today. Go to "Tasks" to add one.</div>';
  tk.sort(function(a,b){return (a.due||'99').localeCompare(b.due||'99')}).forEach(function(t){var d=isDone(t.id);
   h+='<div class="card '+(d?'done':'')+'"><div class="row"><div><div class="t">'+(d?'✅ ':'')+esc(t.title)+'</div><div class="m"><span class="tag">'+esc(t.subject||'General')+'</span>'+(t.due?'by '+fmt(t.due)+' · ':'')+'+'+t.credit+' credits</div></div>'+(d?'':'<button class="ok" onclick="openFin(\''+t.id+'\')">Finish</button>')+'</div></div>'});
  var oth=S.tasks.filter(function(t){return !applies(t)&&!(t.date&&t.date<today())});
  if(oth.length){h+='<h1 style="font-size:16px;margin-top:18px">Other tasks (not today)</h1>';oth.forEach(function(t){h+='<div class="card done"><div class="row"><div><div class="t">'+esc(t.title)+'</div><div class="m"><span class="tag">'+esc(t.subject||'General')+'</span>'+repTxt(t)+(t.due?' · '+fmt(t.due):'')+' · +'+t.credit+'</div></div>'+(isDone(t.id)?'<span class="pos">Done</span>':'<button class="ok" onclick="openFin(\''+t.id+'\')">Finish</button>')+'</div></div>'})}
 }
 if(tab==='tasks'){
  var hh='',mm='',pp='AM';if(D.due){var a=+D.due.slice(0,2);hh=a%12||12;mm=D.due.slice(3);pp=a>=12?'PM':'AM'}
  h+='<h1>My tasks</h1><div class="sub">Choose when each task repeats.</div><div class="card"><label>Subject (example: Math)</label><input id="f_s" value="'+esc(D.s)+'"><label>What do I need to do?</label><input id="f_t" value="'+esc(D.t)+'">';
  h+='<label>Finish before (time)</label><div class="row"><select id="f_h"><option value="">No time</option>'+opts(rng(1,12),hh)+'</select><select id="f_m">'+opts(rng(0,59).map(pad),mm||'00')+'</select><select id="f_p">'+opts(['AM','PM'],pp)+'</select></div>';
  h+='<label>Credits</label><input id="f_c" type="number" min="0" value="'+esc(D.c)+'"><label>Repeat</label><select id="f_r" onchange="grab();render()"><option value="daily"'+(D.rep==='daily'?' selected':'')+'>Every day</option><option value="days"'+(D.rep==='days'?' selected':'')+'>Choose days</option><option value="once"'+(D.rep==='once'?' selected':'')+'>Only today</option></select>';
  if(D.rep==='days')h+='<div class="chips">'+DN.map(function(n,i){return '<label class="chip"><input type="checkbox" class="dchk" value="'+i+'"'+(D.days.indexOf(i)>-1?' checked':'')+'>'+n+'</label>'}).join('')+'</div>';
  h+='<button onclick="saveTask()">'+(edit?'Save changes':'+ Add task')+'</button> '+(edit?'<button class="g" onclick="edit=null;D=newD();render()">Cancel</button>':'')+'</div>';
  S.tasks.forEach(function(t){h+='<div class="card"><div class="row"><div><div class="t">'+esc(t.title)+'</div><div class="m"><span class="tag">'+esc(t.subject||'General')+'</span>'+(t.due?fmt(t.due)+' · ':'')+'+'+t.credit+' · '+repTxt(t)+'</div></div><div>'+(isDone(t.id)?'':'<button class="ok" onclick="openFin(\''+t.id+'\')">Finish</button> ')+'<button class="g" onclick="startEdit(\''+t.id+'\')">Edit</button> <button class="r" onclick="delTask(\''+t.id+'\')">✕</button></div></div></div>'});
 }
 if(tab==='journal'){
  h+='<h1>My journal</h1><div class="sub">'+S.journal.length+' things I did</div>';
  if(!S.journal.length)h+='<div class="card m">Nothing yet. Finish a task and it will show up here.</div>';
  S.journal.forEach(function(j){h+='<div class="card"><div class="row"><div class="t">'+esc(j.title)+'</div><span class="'+(j.earned?'pos':'late')+'">'+(j.earned?'+'+j.earned:'late')+'</span></div><div class="m"><span class="tag">'+esc(j.subject||'General')+'</span>'+esc(j.date)+' '+fmt(j.time)+'</div>'+(j.note?'<div style="margin-top:6px"><b>Why:</b> '+esc(j.note)+'</div>':'')+'<img class="thumb" src="'+j.img+'" alt="proof"></div>'});
 }
 if(tab==='me'){
  var cols=['#2563eb','#e8590c','#2f9e44','#862e9c','#c92a2a','#212529'];
  h+='<h1>Settings</h1><div class="card"><label>My nickname</label><input value="'+esc(S.nick)+'" oninput="S.nick=this.value;save()"><label>Engineering backgrounds</label><div class="sw">'+Object.keys(TH).map(function(k){return '<button class="'+(S.bg===k&&!S.bgImg?'':'g')+'" onclick="setBg(\''+k+'\')">'+TH[k][0]+'</button>'}).join('')+'</div><label>Plain colors</label><div class="sw">'+cols.map(function(c){return '<span style="background:'+c+'" onclick="setBg(\''+c+'\')"></span>'}).join('')+'</div><label>Or use my own picture</label><div><label class="btn g">Choose picture<input type="file" accept="image/*" onchange="bgPic(this)"></label> '+(S.bgImg?'<button class="g" onclick="setBg(S.bg)">Remove</button>':'')+'</div></div>';
  h+='<div class="card"><label>Credits (you can edit)</label><input type="number" min="0" value="'+S.credits+'" onchange="S.credits=Math.max(0,+this.value||0);save();render()"><div class="m">Saved on: '+mode+'</div></div>';
 }
 document.getElementById('app').innerHTML=h;if(typeof tick==='function')tick();
 document.getElementById('nav').innerHTML=[['home','Home'],['tasks','Tasks'],['journal','Journal'],['me','Settings']].map(function(x){return '<button class="'+(tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');
}
function saveTask(){grab();
 if(!D.t.trim()){alert('Please write what you need to do.');return}
 if(D.rep==='days'&&!D.days.length){alert('Choose at least one day.');return}
 var t={subject:D.s.trim(),title:D.t.trim(),due:D.due,credit:Math.max(0,+D.c||0),days:D.rep==='days'?D.days:null,date:D.rep==='once'?today():null};
 if(edit){S.tasks.forEach(function(x){if(x.id===edit)Object.assign(x,t)})}else{t.id='t'+Date.now();S.tasks.push(t)}
 edit=null;D=newD();save();render();
}
function delTask(id){if(confirm('Delete this task?')){S.tasks=S.tasks.filter(function(t){return t.id!==id});save();render()}}
function setBg(c){S.bg=c;S.bgImg='';save();if(col)col.doc('bg').set({img:''}).catch(function(){});render()}
function shrink(file,max,q,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)}
function bgPic(el){if(el.files[0])shrink(el.files[0],900,.5,function(u){S.bgImg=u;save();if(col)col.doc('bg').set({img:u}).catch(function(){});render()})}
function openFin(id){fin=id;pic='';showModal()}
function showModal(){
 var t=S.tasks.filter(function(x){return x.id===fin})[0];if(!t){document.getElementById('modal').innerHTML='';return}
 document.getElementById('modal').innerHTML='<div class="modal"><div class="card"><div class="t">Did you finish "'+esc(t.title)+'"?</div><div class="m" style="margin:6px 0 10px">Upload a picture or proof of what you did.</div><label class="btn g">Choose picture<input type="file" accept="image/*" onchange="getPic(this)"></label><div id="pv"></div><br><label>Explain what you did and why you finished it</label><textarea id="f_note" rows="3" oninput="chk()"></textarea><div class="row"><button class="g" onclick="fin=null;showModal()">Cancel</button><button class="ok" id="yes" onclick="doFin()" disabled>Yes, I did it!</button></div></div></div>';
}
function getPic(el){if(el.files[0])shrink(el.files[0],520,.6,function(u){pic=u;document.getElementById('pv').innerHTML='<img class="thumb" src="'+u+'" alt="">';chk()})}
function chk(){document.getElementById('yes').disabled=!(pic&&f_note.value.trim())}
function doFin(){
 var t=S.tasks.filter(function(x){return x.id===fin})[0];if(!t||!pic||!f_note.value.trim()){alert('Please add a picture and explain what you did.');return}
 var onTime=!t.due||nowHM()<=t.due,earn=onTime?t.credit:0,e={id:'j'+Date.now(),date:today(),time:nowHM(),subject:t.subject,title:t.title,img:pic,note:f_note.value.trim(),earned:earn};
 S.done[today()]=S.done[today()]||{};S.done[today()][t.id]=true;S.credits+=earn;S.journal.unshift(e);
 save();if(col)col.doc(e.id).set(e).catch(function(){});
 fin=null;showModal();render();
 alert(onTime?'Great job! +'+earn+' credits':'Saved to your journal. It was late, so no credits this time.');
}
function claim(){if(confirm('Ask Mom for your gift now? This uses 100 credits.')){S.credits-=GOAL;save();render();alert('Enjoy your gift from Mom!')}}
function tick(){var e=document.getElementById('clk');if(!e)return;var d=new Date(),h=d.getHours();e.textContent=(h%12||12)+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+(h>=12?' PM':' AM')}
setInterval(tick,1000);
render();tick();
</script></body></html>
