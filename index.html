<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIT Hub - Peox Institute of Technology</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --neon-green: #00ff9d;
      --neon-blue: #00d4ff;
      --neon-pink: #ff00a0;
      --dark-base: #0a0a0f;
      --dark-card: #111118;
      --dark-elevated: #1a1a24;
      --text-primary: #e0e0e0;
      --text-secondary: #8888a0;
      --border-glow: rgba(0, 255, 157, 0.3);
      --font-display: 'Orbitron', monospace;
      --font-body: 'Noto Sans SC', 'Noto Sans TC', sans-serif;
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background: var(--dark-base);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      transition: background 0.5s ease;
    }

    .bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; transition: var(--transition); }
    
    body[data-theme="cyberpunk"] {
      background: radial-gradient(circle at 50% 50%, #1a0022 0%, #050008 100%);
    }
    body[data-theme="cyberpunk"] .bg-grid {
      background-image: linear-gradient(rgba(255, 0, 160, 0.35) 2px, transparent 2px),
                        linear-gradient(90deg, rgba(0, 255, 157, 0.35) 2px, transparent 2px);
      background-size: 40px 40px;
    }

    body[data-theme="engineering"] {
      background: radial-gradient(circle at 50% 50%, #2b1a00 0%, #0d0700 100%);
    }
    body[data-theme="engineering"] .bg-grid {
      background-image: linear-gradient(rgba(255, 170, 0, 0.4) 2px, transparent 2px),
                        linear-gradient(90deg, rgba(255, 170, 0, 0.4) 2px, transparent 2px);
      background-size: 25px 25px;
    }

    body[data-theme="bluemix"] {
      background: radial-gradient(circle at 50% 50%, #003366 0%, #000814 100%);
    }
    body[data-theme="bluemix"] .bg-grid {
      background-image: linear-gradient(rgba(0, 212, 255, 0.4) 2px, transparent 2px),
                        linear-gradient(90deg, rgba(0, 212, 255, 0.15) 2px, transparent 2px);
      background-size: 50px 50px;
    }

    body[data-theme="minimal"] {
      background: #000000;
    }
    body[data-theme="minimal"] .bg-grid { display: none; }

    .bg-custom { background-size: cover; background-position: center; opacity: 0.45; transition: opacity 0.5s; }
    .bg-overlay { background: radial-gradient(ellipse at center, transparent 0%, rgba(10, 10, 15, 0.75) 90%); }
    .scanline {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.1) 50%);
      background-size: 100% 4px;
    }

    .app-container { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px; background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-glow);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-brand {
      font-family: var(--font-display); font-size: 1.5rem; font-weight: 900;
      color: var(--neon-green); text-decoration: none; letter-spacing: 2px; cursor: pointer;
    }
    .nav-brand span { color: var(--neon-blue); }
    .nav-links { display: flex; align-items: center; gap: 12px; }

    .btn {
      padding: 10px 20px; border-radius: var(--radius);
      border: 1px solid var(--border-glow); background: transparent;
      color: var(--text-primary); font-size: 0.9rem; cursor: pointer;
      transition: var(--transition); font-family: inherit; display: inline-flex;
      align-items: center; gap: 8px; text-decoration: none; justify-content: center;
    }
    .btn:hover { background: rgba(0, 255, 157, 0.1); border-color: var(--neon-green); box-shadow: 0 0 15px var(--border-glow); }
    .btn-primary { background: linear-gradient(135deg, var(--neon-green), var(--neon-blue)); color: var(--dark-base); border: none; font-weight: 700; }
    .btn-primary:hover { box-shadow: 0 0 25px rgba(0, 255, 157, 0.4); transform: translateY(-1px); }
    .btn-danger { border-color: rgba(255, 50, 50, 0.4); color: #ff5555; }
    .btn-danger:hover { background: rgba(255, 50, 50, 0.1); border-color: #ff5555; }
    .btn-sm { padding: 4px 10px; font-size: 0.8rem; }

    .page { display: none; flex: 1; padding: 32px; max-width: 1200px; margin: 0 auto; width: 100%; }
    .page.active { display: block; }

    .card {
      background: rgba(17, 17, 24, 0.85); border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px); border-radius: var(--radius); padding: 24px; margin-bottom: 20px;
      position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-blue), transparent); opacity: 0.5;
    }
    .card-title { font-family: var(--font-display); font-size: 1.1rem; color: var(--neon-green); margin-bottom: 16px; }

    .landing-hero { text-align: center; padding: 60px 20px 40px; }
    .landing-hero h1 {
      font-family: var(--font-display); font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 900; color: var(--neon-green); margin-bottom: 16px; letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(0,255,157,0.3);
    }
    .landing-hero .subtitle { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 30px; }
    .landing-actions { display: flex; gap: 16px; justify-content: center; margin-bottom: 40px; }

    .form-group { margin-bottom: 20px; }
    .form-label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; }
    .form-input, .form-textarea, .form-select {
      width: 100%; padding: 12px 16px; background: var(--dark-elevated);
      border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius);
      color: var(--text-primary); font-size: 0.95rem; outline: none; transition: var(--transition);
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--neon-green); box-shadow: 0 0 0 3px rgba(0, 255, 157, 0.1); }
    .form-textarea { min-height: 100px; resize: vertical; }

    .hall-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
    .hall-title { font-family: var(--font-display); font-size: 1.4rem; color: var(--neon-green); }
    .search-bar { display: flex; gap: 12px; flex: 1; max-width: 500px; }
    .comments-list { display: flex; flex-direction: column; gap: 16px; }
    
    .comment-item {
      background: var(--dark-card); border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius); padding: 20px; transition: var(--transition);
      position: relative;
    }
    .comment-item.team-reply { border-left: 3px solid var(--neon-green); background: linear-gradient(90deg, rgba(0,255,157,0.05), transparent); }
    .comment-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .comment-avatar {
      width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; background: var(--dark-elevated); border: 1px solid var(--border-glow);
      overflow: hidden; flex-shrink: 0;
    }
    .comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .comment-meta { flex: 1; }
    .comment-name { font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
    .comment-city { font-size: 0.8rem; color: var(--text-secondary); }
    .comment-time { font-size: 0.75rem; color: var(--text-secondary); margin-right: 10px; }
    .comment-body { color: var(--text-primary); line-height: 1.6; margin-bottom: 12px; }

    .comment-actions { display: flex; gap: 10px; margin-top: 8px; align-items: center; }
    .btn-delete {
      position: absolute; top: 16px; right: 16px; background: transparent;
      border: none; color: #ff5555; cursor: pointer; font-size: 1rem; opacity: 0.7; transition: var(--transition);
    }
    .btn-delete:hover { opacity: 1; transform: scale(1.1); }

    .replies-box {
      margin-top: 14px; padding-left: 16px; border-left: 2px solid rgba(0,255,157,0.2);
      display: flex; flex-direction: column; gap: 10px;
    }
    .reply-item {
      background: rgba(255,255,255,0.02); padding: 10px 14px; border-radius: 8px;
      font-size: 0.88rem; position: relative;
    }
    .reply-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; font-size: 0.8rem; color: var(--text-secondary); }
    .reply-user { font-weight: 600; color: var(--neon-blue); }

    .reply-input-box {
      display: none; margin-top: 12px; gap: 8px;
    }

    .team-badge {
      font-size: 0.65rem; padding: 2px 8px; background: var(--neon-green);
      color: var(--dark-base); border-radius: 4px; font-weight: 700; text-transform: uppercase;
    }
    .product-badge {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px;
      background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.3); border-radius: 8px;
      margin-top: 8px; text-decoration: none; color: var(--neon-blue); font-size: 0.85rem;
    }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-container {
      background: var(--dark-card); border: 1px solid var(--border-glow);
      border-radius: var(--radius); width: 100%; max-width: 500px; padding: 28px; position: relative;
    }
    .modal-title { font-family: var(--font-display); font-size: 1.3rem; color: var(--neon-green); margin-bottom: 12px; text-align: center; }

    .avatar-picker { display: flex; gap: 12px; align-items: center; }
    .avatar-preview { width: 50px; height: 50px; border-radius: 50%; background: var(--dark-elevated); border: 1px solid var(--border-glow); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; overflow: hidden; flex-shrink: 0; }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }

    .hidden { display: none !important; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
  </style>
</head>
<body data-theme="cyberpunk">

  <div class="bg-layer bg-grid"></div>
  <div class="bg-layer bg-custom" id="bgCustom"></div>
  <div class="bg-layer bg-overlay"></div>
  <div class="scanline"></div>

  <div class="app-container">
    <nav class="top-nav">
      <a class="nav-brand" onclick="app.showPage('landing')">PIT<span>HUB</span></a>
      <div class="nav-links" id="navLinks"></div>
    </nav>

    <!-- LANDING PAGE -->
    <div class="page active" id="pageLanding">
      <div class="landing-hero">
        <h1>PEOX INSTITUTE OF TECHNOLOGY</h1>
        <p class="subtitle" id="tSubtitle">PIT Hub 赛博朋克公共社区大厅</p>
        <div class="landing-actions" id="landingAuthBtns">
          <button class="btn btn-primary" onclick="app.startWizard('signin')" id="btnSignIn">🔐 登录 (Sign In)</button>
          <button class="btn" onclick="app.startWizard('signup')" id="btnSignUp">✨ 创建账号 (Create Account)</button>
        </div>
      </div>

      <div class="card">
        <div class="hall-header">
          <h2 class="hall-title" id="tHallTitle">🏛️ 社区大厅</h2>
          <div class="search-bar">
            <input type="text" class="form-input" id="searchInput" placeholder="搜索内容..." oninput="app.renderComments()">
          </div>
        </div>
        <div class="comments-list" id="commentsListLanding"></div>
      </div>
    </div>

    <!-- HOME PAGE -->
    <div class="page" id="pageHome">
      <div class="card">
        <div class="card-title" id="tPostTitle">✍️ 发布社区动态</div>
        <div class="form-group">
          <textarea class="form-textarea" id="postContent" placeholder="分享你的想法..."></textarea>
        </div>
        
        <div id="teamPostOptions" class="hidden" style="margin-bottom:16px;">
          <div class="form-group">
            <label class="form-label" id="tSelectProd">挂载推广产品</label>
            <select class="form-select" id="postProductSelect">
              <option value="">-- 不挂载产品 --</option>
            </select>
          </div>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:0.9rem;">
            <input type="checkbox" id="postIsTeam"> <span id="tTeamFlag">标记为团队官方回复 (绿色高亮)</span>
          </label>
        </div>

        <button class="btn btn-primary" onclick="app.createPost()" id="btnPost">🚀 发布内容</button>
      </div>

      <div class="card">
        <div class="hall-header">
          <h2 class="hall-title" id="tListTitle">🏛️ 动态列表</h2>
        </div>
        <div class="comments-list" id="commentsListHome"></div>
      </div>
    </div>

    <!-- PROFILE PAGE -->
    <div class="page" id="pageProfile">
      <div class="card">
        <div class="card-title" id="tProfileTitle">👤 我的个人信息</div>
        <div class="form-group">
          <label class="form-label" id="tNameLabel">用户昵称</label>
          <input type="text" class="form-input" id="profileName">
        </div>
        <div class="form-group">
          <label class="form-label" id="tCityLabel">所在城市</label>
          <input type="text" class="form-input" id="profileCity">
        </div>
        <div class="form-group">
          <label class="form-label" id="tAvatarLabel">虚拟头像 (支持Emoji或上传本地图片)</label>
          <div class="avatar-picker">
            <div class="avatar-preview" id="profileAvatarPreview">👤</div>
            <input type="text" class="form-input" id="profileAvatarText" placeholder="输入 Emoji (例如 🍎/🤖)" oninput="app.updateAvatarPreview('profile')">
            <button class="btn btn-sm" onclick="document.getElementById('profileAvatarFile').click()" id="btnUploadAvatar">📁 本地选择</button>
            <input type="file" id="profileAvatarFile" class="hidden" accept="image/*" onchange="app.handleFileUpload(event, 'profile')">
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label" id="tThemeLabel">选择背景主题风格</label>
          <select class="form-select" id="profileThemeSelect" onchange="app.changeTheme(this.value)"></select>
        </div>

        <div class="form-group">
          <label class="form-label">🖥️ 从电脑上传自定义背景图片</label>
          <div style="display:flex;gap:12px;align-items:center;">
            <button class="btn btn-sm" onclick="document.getElementById('customBgFile').click()">🖼️ 选择电脑上的图片</button>
            <input type="file" id="customBgFile" class="hidden" accept="image/*" onchange="app.handleBgUpload(event)">
            <span id="bgUploadStatus" style="font-size:0.85rem;color:var(--text-secondary);">未选择图片</span>
          </div>
        </div>

        <button class="btn btn-primary" onclick="app.saveProfile()" id="btnSaveProfile">💾 保存设置</button>
      </div>

      <div class="card hidden" id="teamBgCard">
        <div class="card-title" id="tCustomBgTitle">🎨 全站自定义背景图片 URL (PIT Team 专属)</div>
        <div class="form-group">
          <label class="form-label" id="tBgUrlLabel">背景图片 URL</label>
          <input type="text" class="form-input" id="customBgUrl" placeholder="https://example.com/image.jpg">
        </div>
        <button class="btn btn-primary" onclick="app.saveCustomBg()" id="btnApplyBg">🎨 应用全站背景图</button>
      </div>
    </div>

    <!-- EDIT PANEL (Team Only) -->
    <div class="page" id="pageEdit">
      <div class="card">
        <div class="card-title" id="formProductTitle">⚙️ PIT Team 产品管理面板</div>
        <input type="hidden" id="editProductId">
        <div class="form-group">
          <label class="form-label">产品名称</label>
          <input type="text" class="form-input" id="prodName">
        </div>
        <div class="form-group">
          <label class="form-label">产品价格</label>
          <input type="text" class="form-input" id="prodPrice" placeholder="例如: $59.99">
        </div>
        <div class="form-group">
          <label class="form-label">促销标签</label>
          <input type="text" class="form-input" id="prodBadge" placeholder="例如: 90% off">
        </div>
        <div class="form-group">
          <label class="form-label">跳转链接</label>
          <input type="text" class="form-input" id="prodLink" placeholder="https://...">
        </div>
        <div style="display:flex;gap:12px;">
          <button class="btn btn-primary" onclick="app.saveProduct()" id="btnSaveProd">➕ 保存产品</button>
          <button class="btn hidden" onclick="app.cancelProductEdit()" id="btnCancelProd">取消编辑</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📦 已上架产品清单</div>
        <div id="productsContainer"></div>
      </div>
    </div>
  </div>

  <!-- WIZARD MODAL -->
  <div class="modal-overlay" id="wizardModal">
    <div class="modal-container">
      <div id="wizardStep0">
        <h3 class="modal-title">Step 0: 选择语言 / Select Language</h3>
        <div class="form-group">
          <select class="form-select" id="wizardLang" onchange="app.onLanguageChange(this.value)">
            <option value="zh-CN">简体中文</option>
            <option value="zh-HK">繁體中文 (廣東話)</option>
            <option value="zh-TW">繁體中文 (普通話)</option>
            <option value="en">English</option>
          </select>
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="app.nextWizardStep(1)" id="btnWizNext0">下一步 (Next)</button>
      </div>

      <div id="wizardStep1" class="hidden">
        <h3 class="modal-title" id="tWizStep1Title">Step 1: 选择身份</h3>
        <div style="display:flex;gap:12px;margin-bottom:20px;">
          <button class="btn" style="flex:1" onclick="app.completeWizard('visitor')" id="btnWizVisitor">🤖 访客 (Visitor)</button>
          <button class="btn btn-primary" style="flex:1" onclick="app.completeWizard('team')" id="btnWizTeam">⚡ PIT Team</button>
        </div>
      </div>

      <div id="wizardStepVisitor" class="hidden">
        <h3 class="modal-title" id="tWizVisTitle">完善访客信息</h3>
        <div class="form-group">
          <label class="form-label" id="tWizVisNameLabel">虚拟姓名</label>
          <input type="text" class="form-input" id="wizName" placeholder="例如: Neo">
        </div>
        <div class="form-group">
          <label class="form-label" id="tWizVisCityLabel">所在城市</label>
          <input type="text" class="form-input" id="wizCity" placeholder="例如: Cyber City">
        </div>

        <div class="form-group">
          <label class="form-label" id="tWizAvatarLabel">头像 (Emoji 或 本地图片)</label>
          <div class="avatar-picker">
            <div class="avatar-preview" id="wizAvatarPreview">🤖</div>
            <input type="text" class="form-input" id="wizAvatarText" placeholder="Emoji 🍎/🤖" oninput="app.updateAvatarPreview('wiz')">
            <button class="btn btn-sm" onclick="document.getElementById('wizAvatarFile').click()" id="btnWizUpload">📁 选择文件</button>
            <input type="file" id="wizAvatarFile" class="hidden" accept="image/*" onchange="app.handleFileUpload(event, 'wiz')">
          </div>
        </div>

        <button class="btn btn-primary" style="width:100%" onclick="app.finishVisitorReg()" id="btnWizFinish">进入大厅</button>
      </div>
    </div>
  </div>

  <!-- LOGOUT MODAL -->
  <div class="modal-overlay" id="logoutModal">
    <div class="modal-container">
      <h3 class="modal-title" id="tLogoutTitle">确认退出登录？</h3>
      <p style="text-align:center;color:var(--text-secondary);margin-bottom:20px;" id="tLogoutDesc">退出后将返回公开大厅状态。</p>
      <div style="display:flex;gap:12px;justify-content:center;">
        <button class="btn btn-danger" onclick="app.confirmLogout(true)" id="btnLogoutYes">Yes (退出)</button>
        <button class="btn" onclick="app.confirmLogout(false)" id="btnLogoutNo">No (取消)</button>
      </div>
    </div>
  </div>

    class PitHubApp {
      constructor() {
        this.lang = localStorage.getItem('pithub_lang') || 'zh-CN';
        this.user = JSON.parse(localStorage.getItem('pithub_user')) || null;
        this.theme = localStorage.getItem('pithub_theme') || 'cyberpunk';
        this.customBg = localStorage.getItem('pithub_bg') || '';
        this.tempAvatarData = { profile: null, wiz: null };

        this.comments = [];
        this.products = JSON.parse(localStorage.getItem('pithub_products')) || [
          { id: 101, name: 'PhoneBox', price: '$59.99', badge: '90% off', link: '#' }
        ];

        this.init();
      }

      init() {
        this.applyTheme(this.theme);
        this.applyCustomBg();
        this.updateLanguageUI();
        this.updateNav();
        this.renderProducts();
        this.showPage(this.user ? 'home' : 'landing');

        this.listenCloudUpdates();
        this.loadCommentsFromCloud();
      }

      async loadCommentsFromCloud() {
        const { data, error } = await supabaseClient
          .from('comments')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) {
          console.error('拉取云端评论失败:', error);
          return;
        }

        const commentMap = {};
        const mainComments = [];

        data.forEach(item => {
          item.replies = [];
          commentMap[item.id] = item;
        });

        data.forEach(item => {
          if (item.parent_id && commentMap[item.parent_id]) {
            commentMap[item.parent_id].replies.push(item);
          } else if (!item.parent_id) {
            mainComments.push(item);
          }
        });

        this.comments = mainComments;
        this.renderComments();
      }

      listenCloudUpdates() {
        supabaseClient
          .channel('public:comments')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, () => {
            this.loadCommentsFromCloud();
          })
          .subscribe();
      }

      onLanguageChange(lang) {
        this.lang = lang;
        localStorage.setItem('pithub_lang', lang);
        this.updateLanguageUI();
      }

      updateLanguageUI() {
        const dict = i18nDict[this.lang] || i18nDict['zh-CN'];
        
        document.getElementById('tSubtitle').innerText = dict.subtitle;
        document.getElementById('btnSignIn').innerText = dict.signIn;
        document.getElementById('btnSignUp').innerText = dict.signUp;
        document.getElementById('tHallTitle').innerText = dict.hallTitle;
        document.getElementById('tPostTitle').innerText = dict.postTitle;
        document.getElementById('tSelectProd').innerText = dict.selectProd;
        document.getElementById('tTeamFlag').innerText = dict.teamFlag;
        document.getElementById('btnPost').innerText = dict.btnPost;
        document.getElementById('tListTitle').innerText = dict.listTitle;
        document.getElementById('tProfileTitle').innerText = dict.profileTitle;
        document.getElementById('tNameLabel').innerText = dict.nameLabel;
        document.getElementById('tCityLabel').innerText = dict.cityLabel;
        document.getElementById('tAvatarLabel').innerText = dict.avatarLabel;
        document.getElementById('btnUploadAvatar').innerText = dict.uploadBtn;
        document.getElementById('tThemeLabel').innerText = dict.themeLabel;
        document.getElementById('btnSaveProfile').innerText = dict.saveProfile;
        document.getElementById('tCustomBgTitle').innerText = dict.customBgTitle;
        document.getElementById('tBgUrlLabel').innerText = dict.bgUrlLabel;
        document.getElementById('btnApplyBg').innerText = dict.applyBg;

        document.getElementById('btnWizNext0').innerText = dict.wizNext;
        document.getElementById('tWizStep1Title').innerText = dict.wizStep1Title;
        document.getElementById('btnWizVisitor').innerText = dict.wizVisitor;
        document.getElementById('btnWizTeam').innerText = dict.wizTeam;
        document.getElementById('tWizVisTitle').innerText = dict.wizVisTitle;
        document.getElementById('tWizVisNameLabel').innerText = dict.wizVisName;
        document.getElementById('tWizVisCityLabel').innerText = dict.wizVisCity;
        document.getElementById('tWizAvatarLabel').innerText = dict.wizVisAvatar;
        document.getElementById('btnWizUpload').innerText = dict.uploadBtn;
        document.getElementById('btnWizFinish').innerText = dict.wizFinish;

        document.getElementById('tLogoutTitle').innerText = dict.logoutTitle;
        document.getElementById('tLogoutDesc').innerText = dict.logoutDesc;
        document.getElementById('btnLogoutYes').innerText = dict.logoutYes;
        document.getElementById('btnLogoutNo').innerText = dict.logoutNo;

        const themeSelect = document.getElementById('profileThemeSelect');
        themeSelect.innerHTML = `
          <option value="cyberpunk" ${this.theme==='cyberpunk'?'selected':''}>${dict.themes.cyberpunk}</option>
          <option value="engineering" ${this.theme==='engineering'?'selected':''}>${dict.themes.engineering}</option>
          <option value="bluemix" ${this.theme==='bluemix'?'selected':''}>${dict.themes.bluemix}</option>
          <option value="minimal" ${this.theme==='minimal'?'selected':''}>${dict.themes.minimal}</option>
        `;

        document.getElementById('wizardLang').value = this.lang;
      }

      changeTheme(themeKey) {
        this.theme = themeKey;
        localStorage.setItem('pithub_theme', themeKey);
        this.applyTheme(themeKey);
      }

      applyTheme(themeKey) {
        document.body.setAttribute('data-theme', themeKey);
        this.applyCustomBg();
      }

      applyCustomBg() {
        const bgEl = document.getElementById('bgCustom');
        if (this.customBg) {
          bgEl.style.backgroundImage = `url('${this.customBg}')`;
        } else {
          bgEl.style.backgroundImage = 'none';
        }
      }

      handleBgUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          this.customBg = e.target.result;
          localStorage.setItem('pithub_bg', this.customBg);
          this.applyCustomBg();
          document.getElementById('bgUploadStatus').innerText = `已成功设置背景: ${file.name}`;
          alert('自定义本地背景设置成功！');
        };
        reader.readAsDataURL(file);
      }

      saveCustomBg() {
        const url = document.getElementById('customBgUrl').value;
        this.customBg = url;
        localStorage.setItem('pithub_bg', url);
        this.applyCustomBg();
        alert('自定义背景图已保存！');
      }

      handleFileUpload(event, type) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          const result = e.target.result;
          this.tempAvatarData[type] = result;
          this.renderAvatarPreview(type, `<img src="${result}" alt="avatar">`);
        };
        reader.readAsDataURL(file);
      }

      updateAvatarPreview(type) {
        const val = document.getElementById(type === 'profile' ? 'profileAvatarText' : 'wizAvatarText').value;
        if (val) {
          this.tempAvatarData[type] = null;
          this.renderAvatarPreview(type, val);
        }
      }

      renderAvatarPreview(type, contentHtml) {
        const container = document.getElementById(type === 'profile' ? 'profileAvatarPreview' : 'wizAvatarPreview');
        container.innerHTML = contentHtml;
      }

      getAvatarValue(type) {
        if (this.tempAvatarData[type]) {
          return `<img src="${this.tempAvatarData[type]}" alt="avatar">`;
        }
        const textVal = document.getElementById(type === 'profile' ? 'profileAvatarText' : 'wizAvatarText').value;
        return textVal || (type === 'wiz' ? '🤖' : '👤');
      }

      showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const target = document.getElementById(`page${pageId.charAt(0).toUpperCase() + pageId.slice(1)}`);
        if (target) target.classList.add('active');
      }

      updateNav() {
        const navLinks = document.getElementById('navLinks');
        if (!this.user) {
          navLinks.innerHTML = `
            <button class="btn btn-sm btn-primary" onclick="app.startWizard('signin')">Sign In</button>
            <button class="btn btn-sm" onclick="app.startWizard('signup')">Create Account</button>
          `;
        } else {
          let extraLinks = `<button class="btn btn-sm" onclick="app.showPage('profile')">My Info</button>`;
          if (this.user.isTeam) {
            extraLinks += `<button class="btn btn-sm" onclick="app.showPage('edit')">Team Panel</button>`;
            document.getElementById('teamPostOptions').classList.remove('hidden');
            document.getElementById('teamBgCard').classList.remove('hidden');
          } else {
            document.getElementById('teamPostOptions').classList.add('hidden');
            document.getElementById('teamBgCard').classList.add('hidden');
          }
          navLinks.innerHTML = `
            <span style="font-size:0.85rem;color:var(--neon-green)">${this.user.name} ${this.user.isTeam ? '<span class="team-badge">TEAM</span>' : ''}</span>
            <button class="btn btn-sm" onclick="app.showPage('home')">Home</button>
            ${extraLinks}
            <button class="btn btn-sm btn-danger" onclick="app.promptLogout()">Log Out</button>
          `;

          document.getElementById('profileName').value = this.user.name || '';
          document.getElementById('profileCity').value = this.user.city || '';
          if (this.user.avatar && this.user.avatar.includes('<img')) {
            document.getElementById('profileAvatarPreview').innerHTML = this.user.avatar;
          } else {
            document.getElementById('profileAvatarText').value = this.user.avatar || '👤';
            document.getElementById('profileAvatarPreview').innerText = this.user.avatar || '👤';
          }
        }
      }

      startWizard() {
        document.getElementById('wizardModal').classList.add('active');
        document.getElementById('wizardStep0').classList.remove('hidden');
        document.getElementById('wizardStep1').classList.add('hidden');
        document.getElementById('wizardStepVisitor').classList.add('hidden');
      }

      nextWizardStep(step) {
        if (step === 1) {
          document.getElementById('wizardStep0').classList.add('hidden');
          document.getElementById('wizardStep1').classList.remove('hidden');
        }
      }

      completeWizard(type) {
        if (type === 'team') {
          this.user = { name: 'PIT Team Member', isTeam: true, city: 'HQ', avatar: '⚡' };
          localStorage.setItem('pithub_user', JSON.stringify(this.user));
          document.getElementById('wizardModal').classList.remove('active');
          this.updateNav();
          this.showPage('home');
        } else {
          document.getElementById('wizardStep1').classList.add('hidden');
          document.getElementById('wizardStepVisitor').classList.remove('hidden');
        }
      }

      finishVisitorReg() {
        const name = document.getElementById('wizName').value || 'Visitor';
        const city = document.getElementById('wizCity').value || 'Unknown';
        const avatar = this.getAvatarValue('wiz');

        this.user = { name, city, isTeam: false, avatar };
        localStorage.setItem('pithub_user', JSON.stringify(this.user));
        document.getElementById('wizardModal').classList.remove('active');
        this.updateNav();
        this.showPage('home');
      }

      promptLogout() {
        document.getElementById('logoutModal').classList.add('active');
      }

      confirmLogout(yes) {
        document.getElementById('logoutModal').classList.remove('active');
        if (yes) {
          this.user = null;
          localStorage.removeItem('pithub_user');
          this.updateNav();
          this.showPage('landing');
        }
      }

      async createPost() {
        const content = document.getElementById('postContent').value;
        if (!content) return;
        
        let isTeam = false;
        let prodId = null;

        if (this.user && this.user.isTeam) {
          isTeam = document.getElementById('postIsTeam').checked;
          prodId = document.getElementById('postProductSelect').value || null;
        }

        const { error } = await supabaseClient
          .from('comments')
          .insert([{
            name: this.user ? this.user.name : '匿名访客',
            city: this.user ? (this.user.city || 'Local') : 'Local',
            avatar: this.user ? (this.user.avatar || '👤') : '👤',
            content,
            is_team: isTeam,
            product_id: prodId,
            parent_id: null
          }]);

        if (error) {
          alert('发布失败: ' + error.message);
        } else {
          document.getElementById('postContent').value = '';
          this.loadCommentsFromCloud();
        }
      }

      async addReply(commentId) {
        const input = document.getElementById(`replyInput-${commentId}`);
        const content = input ? input.value.trim() : '';
        if (!content) return;

        const { error } = await supabaseClient
          .from('comments')
          .insert([{
            name: this.user ? this.user.name : '访客',
            city: this.user ? (this.user.city || 'Local') : 'Local',
            avatar: this.user ? (this.user.avatar || '👤') : '👤',
            content,
            pa rent_id: commentId
          }]);
        if (error) {
          alert('回复失败: ' + error.message);
        } else {
          input.value = ''; // 清空输入框
          const box = document.getElementById(`replyBox-${commentId}`);
          if (box) box.style.display = 'none'; // 发送后隐藏输入框
          this.loadCommentsFromCloud();
        }
      }

      async deleteComment(id) {
        if (!confirm('确定要删除这条动态吗？')) return;

        const { error } = await supabaseClient
          .from('comments')
          .delete()
          .eq('id', id);

        if (error) {
          alert('删除失败: ' + error.message);
        } else {
          this.loadCommentsFromCloud();
        }
      }

      // Fixed: Explicitly toggle display style
      toggleReplyInput(id) {
        const box = document.getElementById(`replyBox-${id}`);
        if (box) {
          // 检查当前实际生效的 display 样式
          const currentDisplay = window.getComputedStyle(box).display;
          if (currentDisplay === 'none') {
            box.style.setProperty('display', 'flex', 'important');
            const input = document.getElementById(`replyInput-${id}`);
            if (input) input.focus();
          } else {
            box.style.setProperty('display', 'none', 'important');
          }
        }
      }

      renderComments() {
        const query = document.getElementById('searchInput') ? document.getElementById('searchInput').value.toLowerCase() : '';
        const filtered = this.comments.filter(c => c.content.toLowerCase().includes(query) || c.name.toLowerCase().includes(query));

        const html = filtered.length === 0 ? `<div class="empty-state">暂无相关动态</div>` : filtered.map(c => {
          const prod = c.product_id ? this.products.find(p => p.id == c.product_id) : null;
          const avatarDisplay = (c.avatar && c.avatar.includes('<img')) ? c.avatar : `<span>${c.avatar || '👤'}</span>`;
          const repliesList = c.replies || [];
          const timeFormatted = new Date(c.created_at).toLocaleString();

          return `
            <div class="comment-item ${c.is_team ? 'team-reply' : ''}">
              <button class="btn-delete" onclick="app.deleteComment(${c.id})" title="删除动态">🗑️</button>
              <div class="comment-header">
                <div class="comment-avatar">${avatarDisplay}</div>
                <div class="comment-meta">
                  <div class="comment-name">
                    ${c.name} ${c.is_team ? '<span class="team-badge">团队回复</span>' : ''}
                  </div>
                  <div class="comment-city">📍 ${c.city}</div>
                </div>
                <div class="comment-time">${timeFormatted}</div>
              </div>
              <div class="comment-body">${c.content}</div>
              ${prod ? `<a href="${prod.link}" target="_blank" class="product-badge">📦 推荐: ${prod.name} (${prod.price}) <span style="background:var(--neon-pink);color:#fff;padding:2px 6px;border-radius:4px;font-size:0.7rem">${prod.badge}</span></a>` : ''}
              
              <div class="comment-actions">
                <button class="btn btn-sm" onclick="app.toggleReplyInput(${c.id})">💬 回复 (${repliesList.length})</button>
              </div>

              <!-- Nested Replies Block -->
              <div class="replies-box">
                ${repliesList.map(r => `
                  <div class="reply-item">
                    <div class="reply-header">
                      <span class="reply-user">${r.name}</span>
                      <span>${new Date(r.created_at).toLocaleTimeString()}</span>
                    </div>
                    <div>${r.content}</div>
                  </div>
                `).join('')}
                
                <div class="reply-input-box" id="replyBox-${c.id}" style="display: none; margin-top: 12px; gap: 8px;">
                  <input type="text" class="form-input" id="replyInput-${c.id}" placeholder="写下你的回复...">
                  <button class="btn btn-sm btn-primary" onclick="app.addReply(${c.id})">发送</button>
                </div>
              </div>
            </div>
          `;
        }).join('');

        if (document.getElementById('commentsListLanding')) document.getElementById('commentsListLanding').innerHTML = html;
        if (document.getElementById('commentsListHome')) document.getElementById('commentsListHome').innerHTML = html;
      }

      saveProduct() {
        const editId = document.getElementById('editProductId').value;
        const name = document.getElementById('prodName').value;
        const price = document.getElementById('prodPrice').value;
        const badge = document.getElementById('prodBadge').value;
        const link = document.getElementById('prodLink').value;

        if (!name) return alert('请输入产品名称');

        if (editId) {
          const prodIndex = this.products.findIndex(p => p.id == editId);
          if (prodIndex !== -1) {
            this.products[prodIndex] = { id: Number(editId), name, price, badge, link };
          }
        } else {
          const newProd = { id: Date.now(), name, price, badge, link };
          this.products.push(newProd);
        }

        localStorage.setItem('pithub_products', JSON.stringify(this.products));
        this.cancelProductEdit();
        this.renderProducts();
        alert(editId ? '产品更新成功！' : '产品添加成功！');
      }

      editProduct(id) {
        const prod = this.products.find(p => p.id == id);
        if (!prod) return;

        document.getElementById('editProductId').value = prod.id;
        document.getElementById('prodName').value = prod.name;
        document.getElementById('prodPrice').value = prod.price || '';
        document.getElementById('prodBadge').value = prod.badge || '';
        document.getElementById('prodLink').value = prod.link || '';

        document.getElementById('formProductTitle').innerText = '✏️ 编辑现有产品信息';
        document.getElementById('btnSaveProd').innerText = '💾 确认修改';
        document.getElementById('btnCancelProd').classList.remove('hidden');
      }

      cancelProductEdit() {
        document.getElementById('editProductId').value = '';
        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodBadge').value = '';
        document.getElementById('prodLink').value = '';

        document.getElementById('formProductTitle').innerText = '⚙️ PIT Team 产品管理面板';
        document.getElementById('btnSaveProd').innerText = '➕ 保存产品';
        document.getElementById('btnCancelProd').classList.add('hidden');
      }

      renderProducts() {
        const container = document.getElementById('productsContainer');
        const select = document.getElementById('postProductSelect');

        if (container) {
          container.innerHTML = this.products.map(p => `
            <div style="padding:14px;background:var(--dark-elevated);margin-bottom:10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;">
              <div>
                <strong>${p.name}</strong> 
                <span style="color:var(--neon-green);margin-left:8px;">${p.price}</span>
                ${p.badge ? `<span class="team-badge" style="margin-left:8px;background:var(--neon-pink);color:#fff;">${p.badge}</span>` : ''}
              </div>
              <button class="btn btn-sm" onclick="app.editProduct(${p.id})">✏️ 编辑 (Edit)</button>
            </div>
          `).join('');
        }

        if (select) {
          select.innerHTML = '<option value="">-- 不挂载产品 --</option>' + this.products.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
        }
      }

      saveProfile() {
        if (!this.user) return;
        this.user.name = document.getElementById('profileName').value;
        this.user.city = document.getElementById('profileCity').value;
        this.user.avatar = this.getAvatarValue('profile');

        localStorage.setItem('pithub_user', JSON.stringify(this.user));
        this.updateNav();
        alert('个人信息设置已更新！');
      }
    }

    const app = new PitHubApp();
  </script>
</body>
</html>
