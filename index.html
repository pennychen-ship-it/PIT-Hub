<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIT Hub - Peox Institute of Technology</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --neon-green: #00ff9d;
      --neon-blue: #00d4ff;
      --dark-base: #0a0a0f;
      --dark-card: #111118;
      --dark-elevated: #1a1a24;
      --text-primary: #e0e0e0;
      --text-secondary: #8888a0;
      --border-glow: rgba(0, 255, 157, 0.3);
      --font-display: 'Orbitron', monospace;
      --font-body: 'Noto Sans SC', sans-serif;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: var(--dark-base); color: var(--text-primary); min-height: 100vh; }
    
    .top-nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; background: rgba(10,10,15,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-glow); position: sticky; top: 0; z-index: 100; }
    .nav-brand { font-family: var(--font-display); font-size: 1.5rem; font-weight: 900; color: var(--neon-green); cursor: pointer; }
    .nav-brand span { color: var(--neon-blue); }
    
    .btn { padding: 8px 16px; border-radius: var(--radius); border: 1px solid var(--border-glow); background: transparent; color: var(--text-primary); cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, var(--neon-green), var(--neon-blue)); color: var(--dark-base); font-weight: 700; border: none; }
    .btn-sm { padding: 4px 10px; font-size: 0.8rem; }
    
    .page { display: none; padding: 32px; max-width: 1000px; margin: 0 auto; }
    .page.active { display: block; }
    .card { background: var(--dark-card); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
    .form-input, .form-textarea { width: 100%; padding: 10px 14px; background: var(--dark-elevated); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; margin-bottom: 12px; }
    
    .comment-item { background: var(--dark-elevated); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); }
    .comment-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; }
    .comment-user { color: var(--neon-green); font-weight: bold; }
    
    .replies-box { margin-top: 12px; padding-left: 16px; border-left: 2px solid var(--border-glow); }
    .reply-item { background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 0.85rem; }
    
    /* 核心：初始隐藏回复框 */
    .reply-input-box { display: none; margin-top: 10px; gap: 8px; }
  </style>
</head>
<body>

  <nav class="top-nav">
    <div class="nav-brand" onclick="app.showPage('home')">PIT<span>HUB</span></div>
    <div id="navUser"></div>
  </nav>

  <div class="page active" id="pageHome">
    <div class="card">
      <h3 style="color:var(--neon-green);margin-bottom:12px;">✍️ 发布动态</h3>
      <textarea class="form-textarea" id="postContent" placeholder="分享你的想法..."></textarea>
      <button class="btn btn-primary" onclick="app.createPost()">🚀 发布内容</button>
    </div>

    <div class="card">
      <h3 style="color:var(--neon-green);margin-bottom:16px;">🏛️ 社区大厅</h3>
      <div id="commentsList"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zzcoetexcyadwgnicqig.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7SDkgJLqXBH53o9LrHNIXQ_JzO553i8';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    class PitHubApp {
      constructor() {
        this.comments = [];
        this.init();
      }

      init() {
        this.loadComments();
        this.listenUpdates();
      }

      async loadComments() {
        const { data, error } = await supabaseClient
          .from('comments')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) return console.error(error);

        const commentMap = {};
        const mainComments = [];

        data.forEach(item => { item.replies = []; commentMap[item.id] = item; });
        data.forEach(item => {
          if (item.parent_id && commentMap[item.parent_id]) {
            commentMap[item.parent_id].replies.push(item);
          } else if (!item.parent_id) {
            mainComments.push(item);
          }
        });

        this.comments = mainComments;
        this.renderComments();
      }

      listenUpdates() {
        supabaseClient.channel('comments_change')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, () => this.loadComments())
          .subscribe();
      }

      async createPost() {
        const content = document.getElementById('postContent').value;
        if (!content) return;
        await supabaseClient.from('comments').insert([{ name: 'Penny', city: 'Hong Kong', avatar: '👤', content, parent_id: null }]);
        document.getElementById('postContent').value = '';
        this.loadComments();
      }

      async addReply(parentId) {
        const input = document.getElementById(`replyInput-${parentId}`);
        const content = input ? input.value : '';
        if (!content) return;
        await supabaseClient.from('comments').insert([{ name: 'Penny', city: 'Hong Kong', avatar: '👤', content, parent_id: parentId }]);
        this.loadComments();
      }

      // 控制回复文本框显隐的核心函数
      toggleReplyInput(id) {
        const box = document.getElementById(`replyBox-${id}`);
        if (box) {
          if (box.style.display === 'flex') {
            box.style.display = 'none';
          } else {
            box.style.display = 'flex';
            const input = document.getElementById(`replyInput-${id}`);
            if (input) input.focus();
          }
        }
      }

      renderComments() {
        const container = document.getElementById('commentsList');
        if (!this.comments.length) {
          container.innerHTML = '<div style="color:var(--text-secondary);">暂无动态</div>';
          return;
        }

        container.innerHTML = this.comments.map(c => `
          <div class="comment-item">
            <div class="comment-header">
              <span class="comment-user">${c.name}</span>
              <span>${new Date(c.created_at).toLocaleString()}</span>
            </div>
            <div style="margin-bottom:10px;">${c.content}</div>
            <button class="btn btn-sm" onclick="app.toggleReplyInput(${c.id})">💬 回复 (${c.replies.length})</button>

            <div class="replies-box">
              ${c.replies.map(r => `
                <div class="reply-item">
                  <strong>${r.name}:</strong> ${r.content}
                </div>
              `).join('')}
              
              <div class="reply-input-box" id="replyBox-${c.id}" style="display:none;">
                <input type="text" class="form-input" id="replyInput-${c.id}" placeholder="写下你的回复..." style="margin-bottom:0;">
                <button class="btn btn-sm btn-primary" onclick="app.addReply(${c.id})">发送</button>
              </div>
            </div>
          </div>
        `).join('');
      }

      showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(`page${pageId.charAt(0).toUpperCase() + pageId.slice(1)}`).classList.add('active');
      }
    }

    const app = new PitHubApp();
  </script>
</body>
</html>
